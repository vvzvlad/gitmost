# Upstream Docmost's quickstart compose, kept in this fork for reference and as a working
# starting point for running it locally. The placeholders in it — `REPLACE_WITH_LONG_SECRET`,
# `STRONG_DB_PASSWORD`, `localhost:3000` — are upstream's own; fill them in for your own run and
# never commit real values in their place. This file does not describe any deployment of ours,
# and it is not kept in sync with one.

services:
  docmost:
    image: ghcr.io/vvzvlad/gitmost:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: 'REPLACE_WITH_LONG_SECRET'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    # pgvector image (same Postgres major as postgres:18) so `CREATE EXTENSION
    # vector` succeeds for the page_embeddings RAG table.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
