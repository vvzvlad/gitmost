name: Test

# No `paths:` filter: the tool-spec registry lives in `packages/mcp` but its
# parity/tier guard tests live in the `apps/server` jest suite, so a change to
# either package must run both suites (the `test` job via `pnpm -r test`, plus the
# `mcp-server-parity` job).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fails when a migration's timestamped filename sorts BEFORE migrations already
  # applied on the target branch: the Kysely startup migrator rejects that as
  # "corrupted migrations" and crash-loops the app on boot. pull_request diffs
  # against the base branch, push against its `before` SHA (workflow_call from
  # develop.yml inherits the caller's push event); workflow_dispatch has nothing to
  # diff against and skips the job.
  migration-order:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for the base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Added migrations must sort after the newest on the base
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          MIG_DIR="apps/server/src/database/migrations"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # checkout above already did fetch-depth:0 (full history). Fetch the base
            # WITHOUT --depth (a shallow graft would truncate the base history and
            # break the merge-base when the base has moved ahead of the PR merge —
            # exactly the long-branch-vs-moving-base case this gate guards, #361).
            git fetch --no-tags origin "$TARGET_BRANCH"
            BASE="origin/${TARGET_BRANCH}"
          else
            # push event: compare against the pre-push tip of the branch.
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "::notice::branch creation push — nothing to compare"
              exit 0
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              # The before-SHA is not in the clone (a force-push rewrote history).
              # One recovery attempt — refresh every remote head (cheap: the
              # checkout is already fetch-depth:0); a fetch failure aborts via
              # `set -e`, which is fail-closed too.
              git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              # FAIL-CLOSED: without the before-SHA there is no base to prove the
              # ordering against, and a gate whose job is to BLOCK must not guess.
              echo "::error::force-push detected — verify migration order manually, then re-run via workflow_dispatch"
              exit 1
            fi
            BASE="$BEFORE_SHA"
          fi
          newest_on_target=$(git ls-tree -r --name-only "$BASE" "$MIG_DIR" | sort | tail -1)
          # NO `|| true`: a diff failure (e.g. an unresolved merge-base) must fail
          # the job CLOSED — a gate whose job is to BLOCK must never pass on error.
          # `set -e` above already aborts on a non-zero diff exit.
          added=$(git diff --diff-filter=A --name-only "${BASE}...HEAD" -- "$MIG_DIR")
          bad=0
          for f in $added; do
            if [[ "$f" < "$newest_on_target" || "$f" == "$newest_on_target" ]]; then
              echo "::error::Migration $f sorts at or before the newest on the base ($newest_on_target) — rename it with a CURRENT timestamp before merge (do not change its contents). See incident #361."
              bad=1
            fi
          done
          if [ "$bad" -eq 0 ]; then
            echo "Migration order OK (added migrations all sort after $newest_on_target)."
          fi
          exit $bad

  test:
    runs-on: ubuntu-24.04  # not ubuntu-latest: re2 does not compile on 26.04
    timeout-minutes: 20
    # Real Postgres + Redis for the server integration suite (`*.int-spec.ts`,
    # behind `pnpm --filter server test:int`). Postgres uses the pgvector image
    # because migrations create vector columns and global-setup runs `CREATE
    # EXTENSION vector`. Credentials/db match the defaults in
    # apps/server/test/integration/db.ts + global-setup.ts (docmost / docmost_dev_pw,
    # maintenance db `docmost`, redis on 6379), so no TEST_*_URL overrides are needed.
    services:
      postgres:
        # via mirror.gcr.io (Docker Hub pull-through cache; avoids Hub anonymous
        # pull rate-limit that randomly fails on shared GitHub runner IPs).
        image: mirror.gcr.io/pgvector/pgvector:pg18
        env:
          POSTGRES_USER: docmost
          POSTGRES_PASSWORD: docmost_dev_pw
          POSTGRES_DB: docmost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # via mirror.gcr.io (see postgres note above).
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required for the client suite, which resolves @docmost/editor-ext via its
      # dist build (the server suite also rebuilds it through its own pretest).
      - name: Build editor-ext
        run: pnpm --filter @docmost/editor-ext build

      # @docmost/prosemirror-markdown is the shared converter (#293/#326); its
      # build/ is gitignored, and plain `pnpm -r test` does NOT honour nx
      # `dependsOn: ^build`, so its consumers (mcp `pretest: tsc`, git-sync vitest
      # typecheck) fail with TS2307 Cannot find module '@docmost/prosemirror-markdown'
      # unless it is built first. Build it BEFORE git-sync/mcp (which import it).
      - name: Build prosemirror-markdown
        run: pnpm --filter @docmost/prosemirror-markdown build

      # @docmost/token-estimate is a shared workspace package the client vitest
      # suite resolves via its dist build (main: ./dist/index.js); dist/ is
      # gitignored and `pnpm -r test` does NOT honour nx `dependsOn: ^build`, so
      # build it before the recursive test run or the client suite fails with
      # "Failed to resolve import '@docmost/token-estimate'" (#490).
      - name: Build token-estimate
        run: pnpm --filter @docmost/token-estimate build

      # The client's `test` script is `vitest run` (esbuild strips types without
      # checking them), while its `build` script, used by the Docker image, runs
      # `tsc && vite build`. Typecheck explicitly here; tsc reads the workspace
      # packages' .d.ts from dist/, so this step MUST stay below the build steps.
      # tsconfig `include` covers src/**, so test files are checked too.
      - name: Typecheck client
        run: pnpm --filter client typecheck

      # git-sync and mcp build/ is gitignored and the server resolves both via their
      # built build/index.js. The server pretest also builds them, but building here
      # keeps it explicit and independent of pnpm lifecycle ordering.
      - name: Build git-sync and mcp
        run: pnpm --filter @docmost/git-sync build && pnpm --filter @docmost/mcp build

      # Same reason as the client typecheck above: ts-jest only checks the files
      # a spec imports (main.ts is imported by none), so a type error elsewhere
      # in the server reaches the image build green. tsconfig.json has no
      # `include`, so src/** AND test/** (the integration specs) are checked.
      # Below the build steps: tsc reads the workspace packages' .d.ts.
      - name: Typecheck server
        run: pnpm --filter server exec tsc --noEmit

      # The server `lint` script runs `eslint --fix`; the gate must report, not
      # rewrite, so call eslint directly on the same glob.
      - name: Lint server
        run: pnpm --filter server exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Run unit tests
        run: pnpm -r test

      # Integration suite against the real Postgres/Redis services above. Runs
      # the FK-cascade, cost-cap, jsonb-round-trip and real-apply specs that the
      # unit run (mocks only) cannot cover. global-setup drops/recreates the
      # isolated `docmost_test` DB and migrates it to latest.
      - name: Run server integration tests
        run: pnpm --filter server test:int

  # Cross-package tool-spec parity gate: the registry lives in `packages/mcp` but
  # its parity/tier guard tests live in the `apps/server` jest suite. This job runs
  # the mcp `node --test` suite and the server tool-guard jest specs together so the
  # coupling is explicit and no path filter can split it. No Postgres/Redis needed:
  # these specs mock the DB/loader.
  mcp-server-parity:
    runs-on: ubuntu-24.04  # not ubuntu-latest: re2 does not compile on 26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shared deps first (build/ dirs are gitignored; see test.yml build order).
      - name: Build editor-ext
        run: pnpm --filter @docmost/editor-ext build

      - name: Build prosemirror-markdown
        run: pnpm --filter @docmost/prosemirror-markdown build

      # Build the mcp package so build/ carries a FRESH REGISTRY_STAMP (#447): the
      # build runs gen-registry-stamp.mjs before tsc, so a build/ vs src/ skew
      # cannot slip into the tests that exercise the loader's stale-check.
      - name: Build mcp (regenerates REGISTRY_STAMP)
        run: pnpm --filter @docmost/mcp build

      # mcp side: the standalone MCP server's own tool-spec / instructions guards.
      - name: Run mcp tool-spec suite
        run: pnpm --filter @docmost/mcp test

      # server side: the parity + tier guards that read packages/mcp/src/tool-specs
      # and assert the in-app AI-chat wiring matches it.
      - name: Run server tool-spec guard specs
        run: pnpm --filter server exec jest shared-tool-specs.contract tool-tiers ai-chat-tools.service --runInBand

  # The production git-sync path (TP-1): the root-mounted /git smart-HTTP host,
  # the ESM loader of the built @docmost/git-sync, and a real `git http-backend`
  # run in no other job — the unit and integration suites mock all three. Boot
  # the BUILT server with git-sync on and drive it with the live-stand suites in
  # apps/server/test (clone/push/pull/delete/3-way merge, the auth/authz gate,
  # the held-lock 503, rename/reparent/delete-cap).
  git-sync-e2e:
    runs-on: ubuntu-24.04  # not ubuntu-latest: re2 does not compile on 26.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://docmost:docmost@localhost:5432/docmost
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-e2e-secret-change-me-min-32-characters
      APP_URL: http://localhost:3000
      NODE_ENV: production
      # The suites' fixtures: the admin they log in as, and the vault root they
      # assert on (must equal the server's GIT_SYNC_DATA_DIR below).
      EMAIL: admin@test.local
      PASSWORD: Test12345!
      SERVER: http://localhost:3000
      VAULT_DIR: /tmp/gitmost-vaults
    services:
      postgres:
        # via mirror.gcr.io (see the `test` job).
        image: mirror.gcr.io/pgvector/pgvector:pg18
        env:
          POSTGRES_DB: docmost
          POSTGRES_USER: docmost
          POSTGRES_PASSWORD: docmost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor-ext
        run: pnpm --filter @docmost/editor-ext build

      - name: Build server
        run: pnpm server:build

      # The server loads the BUILT git-sync engine over the ESM bridge (and mcp
      # for the embedded /mcp); build/ is gitignored, so build both explicitly.
      - name: Build git-sync and mcp
        run: pnpm --filter @docmost/git-sync build && pnpm --filter @docmost/mcp build

      - name: Run migrations
        run: pnpm --filter ./apps/server migration:latest

      # GIT_SYNC_SERVICE_USER_ID is required at boot once git-sync is on, and
      # the user only exists after setup: boot once with git-sync off, create
      # the admin, take its id as the service user, stop.
      - name: Seed the admin (first boot, git-sync off)
        working-directory: apps/server
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          node dist/main > /tmp/server-seed.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -fsS "$SERVER/api/health" > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS "$SERVER/api/health" > /dev/null
          curl -fsS -X POST "$SERVER/api/auth/setup" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"E2E Admin\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"workspaceName\":\"E2E\"}" \
            > /dev/null
          ADMIN_ID=$(docker exec "$DB_CONTAINER" psql -U docmost -d docmost -tAc \
            "select id from users where email = '$EMAIL'" | tr -d '[:space:]')
          test -n "$ADMIN_ID"
          echo "GIT_SYNC_SERVICE_USER_ID=$ADMIN_ID" >> "$GITHUB_ENV"
          kill "$SERVER_PID"
          wait "$SERVER_PID" || true

      - name: Start the server with git-sync on
        working-directory: apps/server
        env:
          GIT_SYNC_ENABLED: 'true'
          GIT_SYNC_HTTP_ENABLED: 'true'
          GIT_SYNC_DATA_DIR: /tmp/gitmost-vaults
        run: |
          node dist/main > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$SERVER/api/health" > /dev/null 2>&1; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time"
          exit 1

      - name: Run git-sync e2e
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
          DB_USER: docmost
          DB_NAME: docmost
        run: bash apps/server/test/git-sync-e2e.sh

      - name: Run git-sync advanced e2e
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          DB_USER: docmost
          DB_NAME: docmost
        run: bash apps/server/test/git-sync-e2e-advanced.sh

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "--- first boot (seed) ---"; tail -200 /tmp/server-seed.log || true
          echo "--- git-sync boot ---"; tail -300 /tmp/server.log || true
